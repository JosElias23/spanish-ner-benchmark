[project]
name = "spanish-ner"
version = "0.1.0"
description = "End-to-end Spanish Named Entity Recognition: from feature-engineered CRF baselines to a fine-tuned BETO transformer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jose Elias Sanhueza Perez" }]

dependencies = [
    "torch>=2.0",
    "transformers>=4.44,<5",
    "datasets>=2.20",
    "accelerate>=0.33",
    "seqeval>=1.2.2",
    "scikit-learn>=1.3",
    "sklearn-crfsuite>=0.5",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    # transformers<5 requires huggingface-hub<1.0; pinned explicitly because
    # installing gradio>=6 alongside it silently upgrades the hub and breaks
    # transformers at import time.
    "huggingface-hub>=0.34,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
app = ["gradio>=5,<6"]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "httpx>=0.27",          # required by fastapi's TestClient
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
