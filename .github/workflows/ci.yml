name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU-only torch keeps the CI image small; nothing here trains a model.
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The corpus is not committed, so CI fetches and checksum-verifies it.
      # That also proves the download path still works for anyone cloning.
      - name: Fetch and verify the corpus
        run: python scripts/download_data.py

      - name: Test
        run: pytest -q
